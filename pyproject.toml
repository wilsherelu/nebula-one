[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-one"
version = "1.0.0rc2"
description = "Application-layer backend for sustainability analysis on Nebula LCA and TIDAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
nebula-one = "nebula_one.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nebula_one = ["resources/*.json", "resources/model_processing/*.json", "resources/official_methods/*.json", "resources/public_supply/*.json", "resources/steel_catalog/*.json", "resources/steel_catalog/*.zip", "migrations/*.mako"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
